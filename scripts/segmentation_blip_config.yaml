# Test config file for Blip
blip:
  # run configuration
  run_name: '2x2_segmentation'
  run_num: '02'

  # parallelization and optimization
  model_parallel_sizes: [1]
  model_parallel_names: ["model"]
  global_batch_size: 16
  amp_mode: null
  enable_jit: true
  bucket_cap_mb: 25
  lr_schedule: 'cosine'
  num_iterations: 50

  # Comms
  wireup_info: env
  wireup_store: tcp

dataset:
  dataset_mode: 'simulation'
  flow_folder:  '/local_data/segmentation_test/'
  arrakis_folder: '/local_data/segmentation_test/'
  flow_files: 'all'
  dataset_name: 'charge/calib_final_hits/data'
  chunk_size: 10
  positions: ['x', 'y', 'z']
  features: []
  labels: ['topology', 'physics', 'vertex', 'tracklette_begin', 'tracklette_end', 'fragment_begin', 'fragment_end']
  class_weights: ['topology', 'physics', 'vertex', 'tracklette_begin', 'tracklette_end', 'fragment_begin', 'fragment_end']

loader:
  quantization_mode:    "random_subsample"
  minkowski_algorithm:  "speed_optimized"
  batch_size:       1
  test_split:       0.1
  test_seed:        100
  validation_split: 0.3
  validation_seed:  100
  num_workers:      16

scheduler:
  lr_schedule: 'cosine'
  warmup: 1

trainer:
  checkpoint: 10
  progress_bar: 'all'
  rewrite_bar: false

model:
  model_type:       "single"    
  BlipSegmentation:
    in_channels:      1
    out_channels:     [3, 9, 1, 1, 1, 1, 1]
    classifications:  ['topology', 'physics', 'vertex', 'tracklette_begin', 'tracklette_end', 'fragment_begin', 'fragment_end']
    filtrations:      [64, 128, 256, 512]
    residual:         true
    sparse_conv_params:
      kernel_size:     5
      stride:     1
      dilation:   1
      activation: "leaky_relu"
      dimension:  3
      batch_norm: True
      num_of_convs: 2
      dropout:    0.1
    conv_transpose_params:
      kernel_size: 2
      stride:     2
      dilation:   1
      dimension:  3
    max_pooling_params:
      kernel_size: 2
      stride:     2
      dilation:   1
      dimension:  3

criterion:
  BlipSegmentationLoss:
  
metrics:
  BlipSegmentationConfusionMatrix:
  BlipSegmentationROC:

optimizer:
  optimizer_type: "Adam"
  learning_rate:  0.01
  betas:          [0.9, 0.999]
  epsilon:        1e-08
  weight_decay:   0.001
  momentum:       0.9
  max_norm:       1.0
  fused: True